<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Nexara architecture</title>
  <desc id="desc">A polished color-coded architecture diagram showing one-line policy authoring, Nexara policy contracts, catalog simulation, runtime enforcement, signed registries, remote tools, secrets, learning signals, server APIs, and audit explanations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080b"/>
      <stop offset="44%" stop-color="#071015"/>
      <stop offset="100%" stop-color="#141017"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="18%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#29d8d5" stop-opacity=".30"/>
      <stop offset="58%" stop-color="#29d8d5" stop-opacity=".055"/>
      <stop offset="100%" stop-color="#29d8d5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="88%" cy="78%" r="68%">
      <stop offset="0%" stop-color="#e8ad3e" stop-opacity=".25"/>
      <stop offset="60%" stop-color="#e8ad3e" stop-opacity=".045"/>
      <stop offset="100%" stop-color="#e8ad3e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102f3a"/>
      <stop offset="100%" stop-color="#0a1a22"/>
    </linearGradient>
    <linearGradient id="policyFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2b11"/>
      <stop offset="100%" stop-color="#15140e"/>
    </linearGradient>
    <linearGradient id="runtimeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#143d36"/>
      <stop offset="100%" stop-color="#091d21"/>
    </linearGradient>
    <linearGradient id="reviewFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2744"/>
      <stop offset="100%" stop-color="#11131d"/>
    </linearGradient>
    <filter id="shadow" x="-22%" y="-24%" width="144%" height="148%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#000000" flood-opacity=".38"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.16 0 0 0 0 0.85 0 0 0 0 0.84 0 0 0 .38 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#29d8d5"/>
    </marker>
    <marker id="arrowGold" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#e8ad3e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#7fa7c6"/>
    </marker>
    <marker id="arrowRose" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#fca5a5"/>
    </marker>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 800 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .section-title { font: 800 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .note { font: 500 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: rgba(248,250,252,.62); }
      .lane { fill: rgba(255,255,255,.035); stroke: rgba(255,255,255,.11); stroke-width: 1.35; }
      .lane-policy { stroke: rgba(232,173,62,.28); }
      .lane-runtime { stroke: rgba(41,216,213,.28); }
      .lane-external { stroke: rgba(127,167,198,.24); }
      .node { filter: url(#shadow); }
      .host { fill: rgba(41,216,213,.08); stroke: rgba(41,216,213,.52); stroke-width: 1.6; }
      .core { fill: url(#coreFill); stroke: rgba(41,216,213,.68); stroke-width: 1.65; }
      .policy { fill: url(#policyFill); stroke: rgba(232,173,62,.86); stroke-width: 1.85; }
      .runtime { fill: url(#runtimeFill); stroke: rgba(41,216,213,.92); stroke-width: 2.15; filter: url(#softGlow); }
      .review { fill: url(#reviewFill); stroke: rgba(167,139,250,.58); stroke-width: 1.6; }
      .external { fill: rgba(127,167,198,.08); stroke: rgba(127,167,198,.48); stroke-width: 1.5; }
      .audit { fill: rgba(41,216,213,.10); stroke: rgba(41,216,213,.42); stroke-width: 1.5; }
      .danger { fill: rgba(248,113,113,.10); stroke: rgba(248,113,113,.44); stroke-width: 1.5; }
      .text { font: 800 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .small { font: 500 11.5px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: rgba(248,250,252,.64); }
      .micro { font: 800 9.5px ui-monospace, "SFMono-Regular", Menlo, monospace; fill: rgba(248,250,252,.74); letter-spacing: .13em; }
      .mono { font: 700 12px ui-monospace, "SFMono-Regular", Menlo, monospace; fill: rgba(248,250,252,.82); }
      .cyan { fill: #29d8d5; }
      .gold { fill: #e8ad3e; }
      .rose { fill: #fca5a5; }
      .violet { fill: #c4b5fd; }
      .line-cyan { fill: none; stroke: #29d8d5; stroke-width: 2.35; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCyan); }
      .line-gold { fill: none; stroke: #e8ad3e; stroke-width: 2.35; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGold); }
      .line-blue { fill: none; stroke: #7fa7c6; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .line-rose { fill: none; stroke: #fca5a5; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRose); }
      .line-soft { fill: none; stroke: rgba(248,250,252,.34); stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 8; marker-end: url(#arrowBlue); }
      .chip { fill: rgba(255,255,255,.055); stroke: rgba(255,255,255,.12); }
      .chip-cyan { fill: rgba(41,216,213,.12); stroke: rgba(41,216,213,.30); }
      .chip-gold { fill: rgba(232,173,62,.14); stroke: rgba(232,173,62,.34); }
      .chip-rose { fill: rgba(248,113,113,.13); stroke: rgba(248,113,113,.28); }
    </style>
  </defs>

  <rect width="1280" height="820" fill="url(#bg)"/>
  <rect width="1280" height="820" fill="url(#cyanGlow)"/>
  <rect width="1280" height="820" fill="url(#goldGlow)"/>
  <rect width="1280" height="820" fill="url(#grid)" opacity=".78"/>

  <path d="M42 94C190 22 314 92 466 62C616 32 710 10 842 66C974 122 1082 68 1238 96" fill="none" stroke="#29d8d5" stroke-opacity=".13" stroke-width="2"/>
  <path d="M52 724C216 646 352 748 522 704C688 662 754 620 910 682C1058 742 1120 680 1228 718" fill="none" stroke="#e8ad3e" stroke-opacity=".14" stroke-width="2"/>

  <g transform="translate(38 42)">
    <rect class="lane lane-policy" x="0" y="0" width="330" height="704" rx="18"/>
    <text class="title" x="28" y="38">Policy Authoring</text>
    <text class="note" x="28" y="62">one-line intent to reviewable contract</text>
  </g>

  <g transform="translate(396 42)">
    <rect class="lane lane-runtime" x="0" y="0" width="492" height="704" rx="18"/>
    <text class="title" x="28" y="38">Nexara Capability Plane</text>
    <text class="note" x="28" y="62">contracts, registry, runtime enforcement</text>
  </g>

  <g transform="translate(916 42)">
    <rect class="lane lane-external" x="0" y="0" width="326" height="704" rx="18"/>
    <text class="title" x="28" y="38">Host And External Surfaces</text>
    <text class="note" x="28" y="62">models, tools, stores, clients</text>
  </g>

  <!-- Policy authoring lane -->
  <g>
    <rect class="node host" x="74" y="128" width="258" height="74" rx="10"/>
    <text class="micro cyan" x="98" y="154">DEVELOPER INPUT</text>
    <text class="mono" x="98" y="180">reads orders, never refunds</text>

    <rect class="node policy" x="74" y="232" width="258" height="78" rx="10"/>
    <text class="micro gold" x="98" y="258">COMMAND SURFACE</text>
    <text class="text" x="98" y="282">nexara-cli</text>
    <text class="small" x="98" y="300">compile, simulate, explain, sign, verify</text>

    <rect class="node policy" x="74" y="340" width="258" height="96" rx="12"/>
    <text class="micro gold" x="98" y="366">OPT-IN COMPILER</text>
    <text class="text" x="98" y="390">nexara-policy</text>
    <text class="small" x="98" y="411">deterministic grammar and aliases</text>
    <text class="small" x="98" y="429">Markdown and stable JSON output</text>

    <rect class="node review" x="74" y="466" width="258" height="76" rx="10"/>
    <text class="micro violet" x="98" y="492">ENTERPRISE REVIEW</text>
    <text class="text" x="98" y="516">SignedPolicyContract</text>
    <text class="small" x="98" y="534">Ed25519 review envelope</text>

    <rect class="node audit" x="74" y="572" width="258" height="78" rx="10"/>
    <text class="micro cyan" x="98" y="598">DEMO LOOP</text>
    <text class="text" x="98" y="622">policy-shop</text>
    <text class="small" x="98" y="640">allowed read, confirmed export, denied refund</text>
  </g>

  <!-- Nexara lane -->
  <g>
    <rect class="node core" x="430" y="128" width="196" height="82" rx="10"/>
    <text class="micro cyan" x="456" y="154">CONTRACTS</text>
    <text class="text" x="456" y="180">nexara-core</text>
    <text class="small" x="456" y="198">descriptors, policy, audit</text>

    <rect class="node policy" x="666" y="128" width="184" height="82" rx="10"/>
    <text class="micro gold" x="692" y="154">CONTRACT ARTIFACT</text>
    <text class="text" x="692" y="180">PolicyContract</text>
    <text class="small" x="692" y="198">allow, deny, confirm rules</text>

    <rect class="node policy" x="430" y="250" width="196" height="82" rx="10"/>
    <text class="micro gold" x="456" y="276">PREVIEW</text>
    <text class="text" x="456" y="302">Catalog Simulation</text>
    <text class="small" x="456" y="320">allow, deny, confirm, missing</text>

    <rect class="node core" x="666" y="250" width="184" height="82" rx="10"/>
    <text class="micro cyan" x="692" y="276">SIGNED SUPPLY</text>
    <text class="text" x="692" y="302">nexara-registry</text>
    <text class="small" x="692" y="320">manifest hashes and capabilities</text>

    <rect class="node runtime" x="488" y="382" width="304" height="106" rx="12"/>
    <text class="micro cyan" x="522" y="410">ENFORCEMENT</text>
    <text class="text" x="522" y="438">nexara-runtime</text>
    <text class="small" x="522" y="460">deny missing capabilities, apply rules</text>
    <text class="small" x="522" y="478">then trust tiers, scopes, confirmations</text>

    <rect class="node core" x="430" y="532" width="196" height="76" rx="10"/>
    <text class="text" x="456" y="562">nexara-remote</text>
    <text class="small" x="456" y="583">HTTP discovery and calls</text>

    <rect class="node core" x="654" y="532" width="196" height="76" rx="10"/>
    <text class="text" x="680" y="562">nexara-secrets</text>
    <text class="small" x="680" y="583">redacted sync/async stores</text>

    <rect class="node core" x="430" y="638" width="196" height="76" rx="10"/>
    <text class="text" x="456" y="668">nexara-learning</text>
    <text class="small" x="456" y="689">bounded usage signals</text>

    <rect class="node policy" x="654" y="638" width="196" height="76" rx="10"/>
    <text class="text" x="680" y="668">nexara-server</text>
    <text class="small" x="680" y="689">auth, tools, admin APIs</text>
  </g>

  <!-- Host and external lane -->
  <g>
    <rect class="node host" x="952" y="126" width="254" height="76" rx="10"/>
    <text class="micro cyan" x="980" y="152">HOST CONTROL</text>
    <text class="text" x="980" y="178">Host Application</text>
    <text class="small" x="980" y="196">identity, context, final execution</text>

    <rect class="node external" x="952" y="236" width="254" height="74" rx="10"/>
    <text class="text" x="980" y="266">Models</text>
    <text class="small" x="980" y="288">receive filtered descriptors only</text>

    <rect class="node external" x="952" y="344" width="254" height="74" rx="10"/>
    <text class="text" x="980" y="374">Remote Tools</text>
    <text class="small" x="980" y="396">allowlisted endpoints and auth</text>

    <rect class="node external" x="952" y="452" width="254" height="74" rx="10"/>
    <text class="text" x="980" y="482">Stores</text>
    <text class="small" x="980" y="504">memory, JSONL, sled, host storage</text>

    <rect class="node external" x="952" y="560" width="254" height="74" rx="10"/>
    <text class="text" x="980" y="590">HTTP Clients</text>
    <text class="small" x="980" y="612">tool, skill admin, metrics APIs</text>

    <rect class="node danger" x="952" y="668" width="254" height="58" rx="10"/>
    <text class="micro rose" x="980" y="692">BLOCKED BY POLICY</text>
    <text class="small" x="980" y="714">refunds.create without allowed rule</text>
  </g>

  <!-- Flow arrows -->
  <path class="line-gold" d="M203 202 L203 232"/>
  <path class="line-gold" d="M203 310 L203 340"/>
  <path class="line-gold" d="M332 388 C362 374 392 342 430 305"/>
  <path class="line-gold" d="M626 291 C650 266 670 236 704 210"/>
  <path class="line-gold" d="M758 210 C766 236 762 256 758 250"/>
  <path class="line-gold" d="M332 504 C432 506 568 502 640 488"/>

  <path class="line-cyan" d="M626 168 C638 168 650 168 666 168"/>
  <path class="line-cyan" d="M758 332 C744 352 714 370 682 382"/>
  <path class="line-cyan" d="M528 332 C548 356 574 374 604 382"/>
  <path class="line-cyan" d="M792 435 C846 382 894 222 952 164"/>
  <path class="line-cyan" d="M792 435 C860 384 894 306 952 274"/>
  <path class="line-blue" d="M626 570 C742 560 846 436 952 382"/>
  <path class="line-blue" d="M752 532 C820 508 876 494 952 490"/>
  <path class="line-gold" d="M752 638 C828 616 884 600 952 598"/>
  <path class="line-rose" d="M640 488 C730 606 842 668 952 697"/>
  <path class="line-soft" d="M1206 274 C1102 260 974 282 850 291"/>
  <path class="line-soft" d="M1206 382 C1118 372 1014 362 850 291"/>

  <!-- Bottom legend -->
  <g>
    <rect class="chip chip-gold" x="70" y="764" width="174" height="34" rx="17"/>
    <text class="micro gold" x="94" y="785">AUTHORING FLOW</text>
    <rect class="chip chip-cyan" x="276" y="764" width="184" height="34" rx="17"/>
    <text class="micro cyan" x="300" y="785">ENFORCEMENT FLOW</text>
    <rect class="chip chip-rose" x="492" y="764" width="166" height="34" rx="17"/>
    <text class="micro rose" x="516" y="785">DENIED ACTION</text>
    <text class="note" x="688" y="786">Policy contracts are inspectable before runtime, then enforced before any host-owned side effect.</text>
  </g>
</svg>
