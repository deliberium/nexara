<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Nexara architecture</title>
  <desc id="desc">A color-coded architecture diagram showing host applications, Nexara capability plane components, external models, remote tools, stores, and policy enforcement boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071015"/>
      <stop offset="42%" stop-color="#0a141b"/>
      <stop offset="100%" stop-color="#121016"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="22%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#29d8d5" stop-opacity=".26"/>
      <stop offset="55%" stop-color="#29d8d5" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#29d8d5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="84%" cy="78%" r="62%">
      <stop offset="0%" stop-color="#e8ad3e" stop-opacity=".22"/>
      <stop offset="60%" stop-color="#e8ad3e" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#e8ad3e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102f3a"/>
      <stop offset="100%" stop-color="#0a1a22"/>
    </linearGradient>
    <linearGradient id="policyFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2b11"/>
      <stop offset="100%" stop-color="#15140e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity=".36"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.16 0 0 0 0 0.85 0 0 0 0 0.84 0 0 0 .42 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#29d8d5"/>
    </marker>
    <marker id="arrowGold" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#e8ad3e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#7fa7c6"/>
    </marker>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 800 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .note { font: 500 12.5px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: rgba(248, 250, 252, .58); }
      .lane { fill: rgba(255,255,255,.035); stroke: rgba(255,255,255,.11); stroke-width: 1.4; }
      .lane-host { stroke: rgba(41,216,213,.26); }
      .lane-nexara { stroke: rgba(255,255,255,.16); }
      .lane-external { stroke: rgba(232,173,62,.22); }
      .node { rx: 10; filter: url(#shadow); }
      .host { fill: rgba(41,216,213,.08); stroke: rgba(41,216,213,.55); stroke-width: 1.6; }
      .core { fill: url(#coreFill); stroke: rgba(41,216,213,.78); stroke-width: 1.8; }
      .runtime { fill: rgba(20,61,54,.92); stroke: rgba(41,216,213,.9); stroke-width: 2.2; filter: url(#softGlow); }
      .policy { fill: url(#policyFill); stroke: rgba(232,173,62,.84); stroke-width: 1.8; }
      .external { fill: rgba(127,167,198,.08); stroke: rgba(127,167,198,.48); stroke-width: 1.5; }
      .text { font: 800 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .small { font: 500 11.5px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: rgba(248,250,252,.62); }
      .micro { font: 800 9.5px ui-monospace, "SFMono-Regular", Menlo, monospace; fill: rgba(248,250,252,.7); letter-spacing: .14em; }
      .cyan { fill: #29d8d5; }
      .gold { fill: #e8ad3e; }
      .line-cyan { fill: none; stroke: #29d8d5; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCyan); }
      .line-gold { fill: none; stroke: #e8ad3e; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGold); }
      .line-blue { fill: none; stroke: #7fa7c6; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .line-soft { fill: none; stroke: rgba(248,250,252,.35); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 8; marker-end: url(#arrowBlue); }
      .chip { fill: rgba(255,255,255,.06); stroke: rgba(255,255,255,.12); }
      .chip-cyan { fill: rgba(41,216,213,.12); stroke: rgba(41,216,213,.3); }
      .chip-gold { fill: rgba(232,173,62,.14); stroke: rgba(232,173,62,.32); }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect width="1280" height="760" fill="url(#cyanGlow)"/>
  <rect width="1280" height="760" fill="url(#goldGlow)"/>
  <rect width="1280" height="760" fill="url(#grid)" opacity=".8"/>

  <path d="M44 86C186 24 316 84 468 58C615 32 716 8 844 64C974 120 1075 68 1236 92" fill="none" stroke="#29d8d5" stroke-opacity=".12" stroke-width="2"/>
  <path d="M54 676C212 614 352 706 510 668C678 628 748 588 902 642C1054 696 1122 642 1224 676" fill="none" stroke="#e8ad3e" stroke-opacity=".13" stroke-width="2"/>

  <g transform="translate(38 50)">
    <rect class="lane lane-host" x="0" y="0" width="258" height="590" rx="18"/>
    <text class="title" x="30" y="38">Host Application</text>
    <text class="note" x="30" y="62">identity, context, final execution</text>
    <rect class="chip chip-cyan" x="30" y="502" width="168" height="30" rx="15"/>
    <text class="micro cyan" x="48" y="522">HOST CONTROL</text>
  </g>

  <g transform="translate(330 50)">
    <rect class="lane lane-nexara" x="0" y="0" width="620" height="590" rx="18"/>
    <text class="title" x="30" y="38">Nexara Capability Plane</text>
    <text class="note" x="30" y="62">contracts, policy, brokered exposure, audit</text>
    <rect class="chip chip-gold" x="392" y="502" width="176" height="30" rx="15"/>
    <text class="micro gold" x="412" y="522">POLICY BOUNDARY</text>
  </g>

  <g transform="translate(984 50)">
    <rect class="lane lane-external" x="0" y="0" width="258" height="590" rx="18"/>
    <text class="title" x="30" y="38">External Surfaces</text>
    <text class="note" x="30" y="62">models, tools, stores, clients</text>
  </g>

  <!-- Host nodes -->
  <g>
    <rect class="node host" x="74" y="146" width="188" height="70" rx="10"/>
    <circle cx="100" cy="181" r="10" fill="#29d8d5" opacity=".85"/>
    <text class="text" x="122" y="174">Host Adapter</text>
    <text class="small" x="122" y="195">IDE, app, agent host</text>

    <rect class="node host" x="74" y="254" width="188" height="70" rx="10"/>
    <circle cx="100" cy="289" r="10" fill="#29d8d5" opacity=".85"/>
    <text class="text" x="122" y="282">Trust Resolver</text>
    <text class="small" x="122" y="303">caller and surface policy</text>

    <rect class="node host" x="74" y="362" width="188" height="70" rx="10"/>
    <circle cx="100" cy="397" r="10" fill="#29d8d5" opacity=".85"/>
    <text class="text" x="122" y="390">Tool Executor</text>
    <text class="small" x="122" y="411">side effects stay here</text>

    <rect class="node host" x="74" y="470" width="188" height="70" rx="10"/>
    <circle cx="100" cy="505" r="10" fill="#29d8d5" opacity=".85"/>
    <text class="text" x="122" y="498">Built-in Catalog</text>
    <text class="small" x="122" y="519">host-owned tools</text>
  </g>

  <!-- Nexara nodes -->
  <g>
    <rect class="node core" x="388" y="136" width="216" height="86" rx="10"/>
    <text class="micro cyan" x="416" y="162">CONTRACTS</text>
    <text class="text" x="416" y="188">nexara-core</text>
    <text class="small" x="416" y="208">descriptors, broker, audit</text>

    <rect class="node runtime" x="522" y="292" width="256" height="110" rx="12"/>
    <text class="micro cyan" x="556" y="322">ENFORCEMENT</text>
    <text class="text" x="556" y="350">nexara-runtime</text>
    <text class="small" x="556" y="371">selection, trust, limits</text>
    <text class="small" x="556" y="390">confirmation and action gates</text>

    <rect class="node policy" x="534" y="240" width="232" height="38" rx="10"/>
    <text class="micro gold" x="560" y="264">FACADE: crates/nexara feature exports</text>

    <rect class="node core" x="388" y="454" width="216" height="76" rx="10"/>
    <text class="text" x="416" y="484">nexara-registry</text>
    <text class="small" x="416" y="505">signed indexes, manifests</text>

    <rect class="node core" x="660" y="136" width="216" height="76" rx="10"/>
    <text class="text" x="688" y="166">nexara-remote</text>
    <text class="small" x="688" y="187">HTTP discovery and calls</text>

    <rect class="node core" x="660" y="454" width="216" height="76" rx="10"/>
    <text class="text" x="688" y="484">nexara-secrets</text>
    <text class="small" x="688" y="505">redacted sync/async stores</text>

    <rect class="node core" x="388" y="558" width="216" height="76" rx="10"/>
    <text class="text" x="416" y="588">nexara-learning</text>
    <text class="small" x="416" y="609">bounded usage signals</text>

    <rect class="node policy" x="660" y="558" width="216" height="76" rx="10"/>
    <text class="text" x="688" y="588">nexara-server</text>
    <text class="small" x="688" y="609">auth, tools, admin APIs</text>
  </g>

  <!-- External nodes -->
  <g>
    <rect class="node external" x="1018" y="134" width="190" height="68" rx="10"/>
    <text class="text" x="1046" y="164">Models</text>
    <text class="small" x="1046" y="185">descriptors only</text>

    <rect class="node external" x="1018" y="242" width="190" height="68" rx="10"/>
    <text class="text" x="1046" y="272">Remote Tools</text>
    <text class="small" x="1046" y="293">allowlisted endpoints</text>

    <rect class="node external" x="1018" y="350" width="190" height="68" rx="10"/>
    <text class="text" x="1046" y="380">Stores</text>
    <text class="small" x="1046" y="401">memory, JSONL, sled, host</text>

    <rect class="node external" x="1018" y="458" width="190" height="68" rx="10"/>
    <text class="text" x="1046" y="488">Qwen MCP</text>
    <text class="small" x="1046" y="509">imported candidates</text>

    <rect class="node external" x="1018" y="566" width="190" height="68" rx="10"/>
    <text class="text" x="1046" y="596">HTTP Clients</text>
    <text class="small" x="1046" y="617">tools and admin routes</text>
  </g>

  <!-- Flows -->
  <path class="line-cyan" d="M262 181 C308 181 328 181 388 181"/>
  <path class="line-cyan" d="M262 289 C364 296 426 315 522 335"/>
  <path class="line-cyan" d="M522 378 C426 394 360 400 262 397"/>
  <path class="line-cyan" d="M262 505 C352 492 448 426 522 367"/>

  <path class="line-blue" d="M604 178 C626 178 638 176 660 174"/>
  <path class="line-gold" d="M496 222 C534 248 564 270 606 292"/>
  <path class="line-gold" d="M496 454 C526 430 554 412 596 402"/>
  <path class="line-gold" d="M768 454 C742 430 722 414 704 402"/>
  <path class="line-blue" d="M496 558 C528 506 564 452 604 402"/>
  <path class="line-blue" d="M768 558 C744 506 724 452 700 402"/>

  <path class="line-cyan" d="M778 338 C866 300 930 214 1018 168"/>
  <path class="line-blue" d="M876 174 C938 188 964 238 1018 276"/>
  <path class="line-blue" d="M876 492 C934 470 964 414 1018 384"/>
  <path class="line-gold" d="M876 596 C934 596 964 598 1018 600"/>
  <path class="line-soft" d="M1018 492 C952 416 922 274 876 174"/>
  <path class="line-soft" d="M1018 492 C824 490 680 472 604 492"/>

  <rect class="chip chip-gold" x="382" y="672" width="184" height="34" rx="17"/>
  <text class="micro gold" x="406" y="693">POLICY BOUNDARY</text>
  <text class="note" x="584" y="693">learning, imports, registries, and remotes cannot bypass runtime enforcement</text>
</svg>
