[package]
name = "nexara"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["runtime"]
registry = ["dep:nexara-registry"]
remote = ["dep:nexara-remote"]
secrets = ["dep:nexara-secrets"]
runtime = ["dep:nexara-runtime"]
learning = ["dep:nexara-learning"]
learning-memory = ["learning", "dep:nexara-learning-memory"]
learning-jsonl = ["learning", "dep:nexara-learning-jsonl"]
learning-sled = ["learning", "dep:nexara-learning-sled"]
compat-qwen = ["dep:nexara-compat-qwen"]
server = ["runtime", "registry", "dep:nexara-server"]
policy = ["dep:nexara-policy"]
all = [
    "registry",
    "remote",
    "secrets",
    "runtime",
    "learning-memory",
    "learning-jsonl",
    "learning-sled",
    "compat-qwen",
    "server",
    "policy",
]

[dependencies]
nexara-core = { path = "../nexara-core", version = "0.1.1" }
nexara-registry = { path = "../nexara-registry", version = "0.1.1", optional = true }
nexara-remote = { path = "../nexara-remote", version = "0.1.1", optional = true }
nexara-secrets = { path = "../nexara-secrets", version = "0.1.1", optional = true }
nexara-runtime = { path = "../nexara-runtime", version = "0.1.1", optional = true }
nexara-learning = { path = "../nexara-learning", version = "0.1.1", optional = true }
nexara-learning-memory = { path = "../nexara-learning-memory", version = "0.1.1", optional = true }
nexara-learning-jsonl = { path = "../nexara-learning-jsonl", version = "0.1.1", optional = true }
nexara-learning-sled = { path = "../nexara-learning-sled", version = "0.1.1", optional = true }
nexara-compat-qwen = { path = "../nexara-compat-qwen", version = "0.1.1", optional = true }
nexara-server = { path = "../nexara-server", version = "0.1.1", optional = true }
nexara-policy = { path = "../nexara-policy", version = "0.1.1", optional = true }
