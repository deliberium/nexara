[advisories]
version = 2
yanked = "warn"
# Optional sled backend dependencies have no maintained compatible replacement.
# Keep these maintenance-only exceptions scoped to their advisory IDs.
ignore = ["RUSTSEC-2025-0057", "RUSTSEC-2024-0384"]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
